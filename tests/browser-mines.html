<!doctype html><meta charset="utf-8"><pre id="report">RUNNING</pre><iframe id="game" src="../web/mines.html" style="width:360px;height:1800px"></iframe><script>
game.onload=()=>{try{const d=game.contentDocument,w=game.contentWindow;const checks=[];function check(v,text){if(!v)throw Error(text);checks.push(text);}let cells=[...d.querySelectorAll('.mine-cell')];check(cells.length===81,'easy 81 cells');check(d.documentElement.scrollWidth<=w.innerWidth,'mobile page fits');const size=cells[0].getBoundingClientRect();check(Math.abs(size.width-size.height)<1,'square cells');d.querySelector('#flag-mode').click();cells[0].click();check(cells[0].querySelector('img').alt==='Мику','Miku flag');check(d.querySelector('#remaining').textContent==='9','flag counter');d.querySelector('#reveal-mode').click();cells[0].click();check(!cells[0].classList.contains('open'),'flag protects cell');cells[0].dispatchEvent(new w.MouseEvent('contextmenu',{bubbles:true,cancelable:true}));check(!cells[0].querySelector('img'),'right click removes flag');cells[0].click();check(cells[0].classList.contains('open')&&!d.querySelector('#result').open,'safe first opening');
const engine=w.MinesGame;const oldPlace=engine.prototype.place;engine.prototype.place=function(first){oldPlace.call(this,first);this.cells.forEach(c=>c.mine=false);for(const i of [2,4,6,20,24,38,42,56,60,80])this.cells[i].mine=true;this.cells.forEach((c,i)=>c.count=this.neighbors(i).filter(j=>this.cells[j].mine).length);};d.querySelector('#restart').click();cells=[...d.querySelectorAll('.mine-cell')];cells[0].click();cells[80].click();check(d.querySelector('#result').open&&d.querySelector('#result-text').textContent.includes('Попалась'),'loss popup');check([...d.querySelectorAll('.mine-cell img')].some(img=>img.alt==='Тето'),'Teto bombs revealed');d.querySelector('#again').click();check(d.querySelector('#remaining').textContent==='10'&&!d.querySelector('#result').open,'restart resets');engine.prototype.place=function(first){oldPlace.call(this,first);this.cells.forEach((c,i)=>c.mine=i>=71);this.cells.forEach((c,i)=>c.count=this.neighbors(i).filter(j=>this.cells[j].mine).length);};d.querySelector('.mine-cell').click();check(d.querySelector('#result').open&&d.querySelector('#result-text').textContent.includes('Победа'),'victory popup');check(d.querySelectorAll('.mine-cell.flagged img').length===10,'victory marks mines with Miku');d.querySelector('#again').click();engine.prototype.place=oldPlace;
d.querySelector('#difficulty').value='hard';d.querySelector('#difficulty').dispatchEvent(new w.Event('change'));check(d.querySelectorAll('.mine-cell').length===256,'hard 256 cells');check(d.documentElement.scrollWidth<=w.innerWidth,'hard scroll stays inside panel');check(d.querySelector('.mine-scroll').scrollWidth>d.querySelector('.mine-scroll').clientWidth,'hard board scrolls');document.querySelector('#report').textContent='PASS: '+checks.join('; ');}catch(e){document.querySelector('#report').textContent='FAIL: '+e.message;}};
</script>
